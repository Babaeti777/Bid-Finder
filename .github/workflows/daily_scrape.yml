name: Daily Bid Scrape

on:
  schedule:
    # 1 PM UTC = 8 AM ET (year-round, close enough for EST/EDT)
    - cron: "0 13 * * *"
  workflow_dispatch:  # Manual trigger from GitHub UI

env:
  PYTHON_VERSION: "3.11"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Download previous database
        uses: actions/download-artifact@v4
        with:
          name: bids-database
          path: .
        continue-on-error: true

      - name: Run bid finder
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
          SHEETS_SPREADSHEET_NAME: ${{ secrets.SHEETS_SPREADSHEET_NAME }}
          BIDNET_EMAIL: ${{ secrets.BIDNET_EMAIL }}
          BIDNET_PASSWORD: ${{ secrets.BIDNET_PASSWORD }}
          OPENGOV_EMAIL: ${{ secrets.OPENGOV_EMAIL }}
          OPENGOV_PASSWORD: ${{ secrets.OPENGOV_PASSWORD }}
        run: python main.py --email --sheets

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: bids-database
          path: bids.db
          retention-days: 90

      - name: Trigger dashboard refresh
        if: ${{ secrets.RENDER_DASHBOARD_URL != '' }}
        env:
          RENDER_DASHBOARD_URL: ${{ secrets.RENDER_DASHBOARD_URL }}
          API_TRIGGER_KEY: ${{ secrets.API_TRIGGER_KEY }}
        run: |
          curl -s -X POST "${RENDER_DASHBOARD_URL}/api/run" \
            -H "X-API-Key: ${API_TRIGGER_KEY}" \
            --max-time 10 || echo "Dashboard trigger skipped"
        continue-on-error: true
